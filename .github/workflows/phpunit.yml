name: PHPunit Cassandra (ScyllaDB)

on:
  push:
    branches:
      - master
  pull_request: null

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            image: php:8.4-cli
          - php: '8.5'
            image: php:8.5-cli
          - php: '8.6'
            image: php:8.6-rc-cli # TODO: switch to php:8.6-cli once PHP 8.6 is released

    name: PHPunit Cassandra - PHP ${{ matrix.php }}

    # official php image (Debian based, so the runner's node works inside it); the cassandra extension
    # (he4rt/scylladb-php-driver, maintained fork of the DataStax driver) is compiled in the first step
    container:
      image: ${{ matrix.image }}

    services:
      scylla:
        image: scylladb/scylla:5.4
        options: >-
          --health-cmd="cqlsh -e 'describe cluster'"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=20

    steps:
      # php:*-cli images ship without git; without it actions/checkout falls back to a REST API tarball,
      # which honours the export-ignore rules in .gitattributes and therefore drops tests/ and phpunit.xml.dist
      - name: Install git
        run: apt-get update -qq && apt-get install -yqq --no-install-recommends git

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cassandra extension and composer
        # https://github.com/mlocati/docker-php-extension-installer
        run: |
          curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
          chmod +x /usr/local/bin/install-php-extensions
          # pcov provides the code coverage driver for phpunit --coverage-text
          install-php-extensions cassandra pcov @composer
          # php:8.6-rc-cli ships without mbstring, which phpunit needs
          if ! php -m | grep -qi '^mbstring$'; then
            apt-get update -qq && apt-get install -yqq --no-install-recommends libonig-dev
            docker-php-ext-install mbstring
          fi
          php -m | grep -i -E '^(cassandra|mbstring|pcov)$'

      - name: Composer update
        run: composer update --no-progress --no-interaction

      - name: Check ScyllaDB service is reachable
        run: |
          getent hosts scylla || echo "hostname scylla does not resolve"
          php -r '$s = @fsockopen("scylla", 9042, $errno, $errstr, 5); echo $s ? "scylla:9042 reachable\n" : "scylla:9042 NOT reachable: $errstr\n";'
          php -r '$s = Cassandra::cluster()->withContactPoints("scylla")->withPort(9042)->build()->connect(); echo "cassandra driver connected\n";'

      - name: PHPunit
        run: php vendor/bin/phpunit --coverage-text
        env:
          PHOENIX_CASSANDRA_HOST: scylla
          PHOENIX_CASSANDRA_PORT: 9042
          PHOENIX_CASSANDRA_KEYSPACE: phoenix
